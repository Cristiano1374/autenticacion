spring.application.name=authentication
spring.datasource.url=jdbc:postgresql://localhost:5433/accesos
spring.datasource.username=accesos
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret-key=mySecretKey
jwt.expiration-time=3600000 # 1 hour in milliseconds
jwt.issuer=myAppIssuer
jwt.audience=myAppAudience

# Security Configuration
spring.security.oauth2.client.registration.my-client.client-id=myClientId
spring.security.oauth2.client.registration.my-client.client-secret=myClientSecret
spring.security.oauth2.client.registration.my-client.redirect-uri=http://localhost:8080/login/oauth2/code/my-client

# Springdoc OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

#springdoc.swagger-ui.path=/doc/swagger-ui.html