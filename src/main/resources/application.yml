server:
  servlet:
    context-path: /autenticacion # Context path de la aplicación
  port: 8083 # Puerto en el que se ejecutará la aplicación

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs # Ruta del endpoint de OpenAPI JSON
  swagger-ui:
    enabled: true
    path: /swagger-ui.html # Ruta de la interfaz de Swagger UI
